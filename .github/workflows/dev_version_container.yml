name: Build container for development versions

on:
    push:
      branches:
        '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
    build_and_push_docker:
            name: "Build and push docker image"
            runs-on: ubuntu-latest
            permissions:
                contents: read
                packages: write
                attestations: write
                id-token: write
                artifact-metadata: write
            steps:
                - name: Checkout Repo
                  uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

                - name: Connect container registry
                  uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
                  with:
                    registry: ${{env.REGISTRY}}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

                - name: Get Metadata for Docker
                  id: metadata
                  uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
                  with:
                    images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                    tags: |
                      type=ref,event=branch
                      type=sha

                - name: Set up Docker Buildx
                  uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

                - name: Build and push Docker image
                  id: push
                  uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
                  with:
                    context: .
                    push: true
                    labels: ${{ steps.metadata.outputs.labels }}
                    tags: ${{ steps.metadata.outputs.tags }}
                    cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devbuildcache
                    cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devbuildcache,mode=max
