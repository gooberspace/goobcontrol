name: Release on Tag

on:
    push:
        tags:
            - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
    build_and_release_binaries:
        name: "build and release binaries"
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write
            attestations: write
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0
                  fetch-tags: true
            - name: Setup Go Environment
              uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
              with:
                go-version: '1.26.x'
            - name: Get dependencies
              run: make get-deps
            - name: Build Linux AMD64
              run: make build-linux-amd64
            - name: Build Linux ARM64
              run: make build-linux-arm64
            - name: Build Windows AMD64
              run: make build-windows-amd64
            - name: Generate artifact attestation
              uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
              with:
                subject-path: 'bin/*'
            - name: Create release
              uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b
              with:
                artifacts: "bin/*"
                generateReleaseNotes: true
                allowUpdates: true
    build_and_push_docker:
            name: "Build and push docker image"
            runs-on: ubuntu-latest
            permissions:
                contents: read
                packages: write
                attestations: write
                id-token: write
                artifact-metadata: write
            steps:
                - name: Checkout Repo
                  uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

                - name: Connect container registry
                  uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
                  with:
                    registry: ${{env.REGISTRY}}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

                - name: Get Metadata for Docker
                  id: metadata
                  uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
                  with:
                    images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

                - name: Build and push Docker image
                  id: push
                  uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
                  with:
                    context: .
                    push: true
                    tags: ${{ steps.metadata.outputs.tags }}
                    labels: ${{ steps.metadata.outputs.labels }}

                - name: Generate artifact attestation
                  uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
                  with:
                    subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
                    subject-digest: ${{ steps.push.outputs.digest }}
                    push-to-registry: true

